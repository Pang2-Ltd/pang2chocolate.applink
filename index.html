<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <!-- Open Graph 메타 태그 (카카오톡, 페이스북, 인스타그램 등) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://pang2chocolate.github.io/pang2chocolate/" />
  <meta property="og:title" content="팽이초콜릿" />
  <meta property="og:description" content="팽이는 함께 돌려야 더 재밌어!" />
  <meta property="og:image" content="https://pang2chocolate.github.io/pang2chocolate/images/og-image.png" />
  <meta property="og:image:width" content="1200" />

  썸내일
  <meta property="og:image" content="https://pang2chocolate-eng.github.io/pang2chocolate.applink/배경화면.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  
  <script>
    window.onload = function() {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;

      // 1. 플레이스토어 / 앱스토어 링크
      var androidUrl = "https://play.google.com/store/apps/details?id=com.pang2chocolate.pang2chocolate";
      var iosUrl     = "https://apps.apple.com/app/id6801701370";
      var fallbackUrl = "https://www.pang2chocolate.com/";

      // 2. iOS 판별
      if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        window.location.href = iosUrl;
      }
      // 3. 안드로이드 판별
      else if (/android/i.test(userAgent)) {
        window.location.href = androidUrl;
      }
      // 4. 기타 PC
      else {
        window.location.href = fallbackUrl;
      }
    };
  </script>
</head>
<body>
  <p style="text-align: center; margin-top: 50px; font-family: sans-serif;">
    스토어로 이동 중입니다...
  </p>
</body>
</html>
